name: Rebase and Tag Recia

on:
  push:
    branches:
      - master
      - recia
  workflow_dispatch:
    inputs:
      version:
        description: "Version au format vX.Y.Z"
        required: true
        type: string

jobs:
  rebase-and-tag:
    if: github.actor == 'RiotRobot' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect version in commit message (only for push)
        id: detect
        if: github.event_name == 'push'
        run: |
          MSG="$(git log -1 --pretty=%B)"
          if [[ "$MSG" =~ v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="${BASH_REMATCH[0]}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "No version found in commit message, skipping."
            exit 0
          fi

      - name: Ask for version if manual
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT

      - name: Fetch all branches
        run: git fetch origin

      - name: Checkout recia branch
        run: git checkout recia

      - name: Rebase recia on master
        run: |
          set -e
          if ! git rebase origin/master; then
            echo "❌ Rebase failed, aborting..."
            git rebase --abort
            exit 1
          fi

      - name: Push rebased branch
        run: git push origin recia --force-with-lease

      - name: Create and push recia tag
        run: |
          VERSION="${{ steps.detect.outputs.version || steps.manual.outputs.version }}"
          TAG="${VERSION}-recia"
          git tag "$TAG"
          git push origin "$TAG"
